spring:
  application:
    name: bcttg
  datasource:
    url: jdbc:mysql://localhost:3306/bcttg?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: bcttg
    password: bcttg
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB

app:
  security:
    jwt:
      issuer: bcttg
      secret: ${BCTTG_JWT_SECRET:ChangeMe_AtLeast_32_Chars_Long_Secret}
      access-token-ttl-minutes: 120
    users:
      - username: admin
        password: admin123
        roles: ["ADMIN"]
      - username: manager
        password: manager123
        roles: ["MANAGER"]
      - username: user
        password: user123
        roles: ["USER"]
  media:
    storage-root: ${BCTTG_MEDIA_ROOT:./storage}
    base-url: ${BCTTG_MEDIA_BASE_URL:http://localhost:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
