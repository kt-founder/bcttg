spring:
  datasource:
    url: jdbc:mysql://mysql:3306/${BCTTG_DB_NAME:bcttg}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${BCTTG_DB_USER:bcttg}
    password: ${BCTTG_DB_PASS:bcttg}
    hikari:
      initialization-fail-timeout: 0
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    connect-retries: 30
    connect-retries-interval: 5

app:
  media:
    base-url: ${BCTTG_MEDIA_BASE_URL:http://localhost:8080}
  swagger:
    title: BCTTG API
    description: API tai lieu va thuc thi So tay dien tu
    version: v1
    server-url: /
    contact-name: Support
    contact-email: support@bcttg.local
    contact-url: https://bcttg.local

server:
  forward-headers-strategy: framework

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    url: /api-docs
    config-url: /api-docs/swagger-config
    display-request-duration: true
    doc-expansion: none
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    persist-authorization: true
    default-models-expand-depth: -1
